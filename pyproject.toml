[project]
name = "low-resource-kg-artifact"
version = "0.1.0"
description = "Research artifact for low-resource joint entity and relation extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.2",
    "torch==2.9.1",
    "transformers>=4.46.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
